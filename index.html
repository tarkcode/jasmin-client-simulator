<!DOCTYPE html>
<!--
  Client SMS Simulator
  Open directly in a browser — no server, no deployment needed.
  Sends messages to /api/send/ exactly as a real client HTTP integration would.
  Use this to test fake-DLR interception (percentage / threshold / window)
  from the outside without needing admin access to the Jasmin Web Panel.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client SMS Simulator</title>
<style>
:root {
  --bg:#0f1117; --surface:#171b24; --raised:#1e2230; --border:#272c3a;
  --text:#e4e8f0; --muted:#7a8299; --accent:#4c8bf5; --accent-h:#3a74d8;
  --ok:#22c55e; --err:#ef4444;
  --r:6px; --r-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.55;padding:28px 24px;}
h1{font-size:17px;font-weight:700;margin-bottom:3px;}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:24px;}
.sub code{background:var(--raised);border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;font-size:11.5px;}
/* layout */
.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start;}
@media(max-width:820px){.layout{grid-template-columns:1fr;}}
/* card */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px;}
.sect{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 10px;}
.sect:first-child{margin-top:0;}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0;}
/* inputs */
label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 3px;}
label:first-of-type{margin-top:0;}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);border-radius:var(--r);padding:7px 10px;font-size:13px;
  font-family:inherit;transition:border-color .12s;}
input:focus,textarea:focus{outline:none;border-color:var(--accent);}
input[type=number]{-moz-appearance:textfield;}
textarea{resize:vertical;min-height:56px;}
.row2{display:flex;gap:10px;}
.row2>div{flex:1;min-width:0;}
/* buttons */
.btn{width:100%;border:none;border-radius:var(--r);padding:9px 14px;
  font-size:13px;font-weight:600;cursor:pointer;transition:background .12s;}
.btn+.btn{margin-top:8px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--accent-h);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover:not(:disabled){background:var(--raised);}
.btn-sm{width:auto;padding:5px 11px;font-size:12px;}
.summary{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;}
/* table */
.toolbar{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;}
.scroll{border:1px solid var(--border);border-radius:var(--r);
  max-height:520px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
th{color:var(--muted);font-weight:600;background:var(--surface);
  position:sticky;top:0;z-index:1;}
td.body-col{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:700;}
.b-ok{background:rgba(34,197,94,.13);color:var(--ok);}
.b-err{background:rgba(239,68,68,.13);color:var(--err);}
.b-fake{background:rgba(76,139,245,.13);color:var(--accent);}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<h1>Client SMS Simulator</h1>
<div class="sub">
  Mimics a client's HTTP integration — hits <code>/api/send/</code> directly
  so you can verify fake-DLR interception without touching the admin panel.
</div>

<div class="layout">
  <!-- Left: config form -->
  <div class="card">
    <div class="sect">Connection</div>
    <label for="apiBase">Panel base URL</label>
    <input id="apiBase" value="http://161.97.156.97:8999" placeholder="http://host:port">
    <div class="row2">
      <div>
        <label for="username">Username</label>
        <input id="username" value="PrinceTest">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="SMPP password">
      </div>
    </div>

    <div class="sect">Message</div>
    <div class="row2">
      <div>
        <label for="fromAddr">From</label>
        <input id="fromAddr" value="TEST">
      </div>
      <div>
        <label for="toAddr">To</label>
        <input id="toAddr" value="+10000000000">
      </div>
    </div>
    <label for="content">Content</label>
    <textarea id="content">Fake DLR test message</textarea>

    <div class="sect">Burst</div>
    <div class="row2">
      <div>
        <label for="burstCount">Count</label>
        <input id="burstCount" type="number" min="1" max="100" value="1">
      </div>
      <div>
        <label for="burstDelay">Delay (ms)</label>
        <input id="burstDelay" type="number" min="0" step="50" value="300">
      </div>
    </div>

    <hr class="sep">
    <button class="btn btn-primary" id="sendBtn" type="button">&#9654;&nbsp;Send</button>
    <button class="btn btn-ghost" id="clearBtn" type="button">Clear log</button>
    <div class="summary" id="summary">No messages sent yet.</div>
  </div>

  <!-- Right: log -->
  <div class="card">
    <div class="toolbar">
      <div class="sect" style="margin:0;">Request log</div>
      <button class="btn btn-ghost btn-sm" id="exportBtn" type="button">Export CSV</button>
    </div>
    <div class="scroll" id="tableWrap">
      <div class="empty" id="emptyState">Send a message to see results here.</div>
      <table id="logTable" style="display:none;">
        <thead>
          <tr><th>#</th><th>Time</th><th>HTTP</th><th>ms</th><th>Result</th><th class="body-col">msgid / response</th></tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  var sendBtn   = document.getElementById('sendBtn');
  var clearBtn  = document.getElementById('clearBtn');
  var exportBtn = document.getElementById('exportBtn');
  var logBody   = document.getElementById('logBody');
  var logTable  = document.getElementById('logTable');
  var emptyState = document.getElementById('emptyState');
  var summaryEl = document.getElementById('summary');

  var rows = [];
  var total = 0, okCount = 0, fakeCount = 0, errCount = 0;

  function updateSummary() {
    summaryEl.textContent =
      total + ' sent \u00b7 ' + okCount + ' real ok \u00b7 ' +
      fakeCount + ' fake-intercepted \u00b7 ' + errCount + ' failed';
  }

  // Fake-DLR msgids are written by fake_dlr_send() as 'FAKE-<16 hex chars>'
  // e.g.  Success "FAKE-A3B1C2D4E5F6A7B8"
  // Real Jasmin msgids look like UUIDs or numeric strings with no FAKE- prefix.
  function classify(httpStatus, body) {
    var ok = httpStatus >= 200 && httpStatus < 300 &&
             /success/i.test(body);
    var msgidMatch = body.match(/"([^"]+)"/);
    var msgid = msgidMatch ? msgidMatch[1] : '';
    var fake = ok && /^FAKE-/i.test(msgid);
    return { ok: ok, fake: fake, msgid: msgid };
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addRow(entry) {
    rows.push(entry);
    emptyState.style.display = 'none';
    logTable.style.display   = '';
    var tr  = document.createElement('tr');
    var cls = entry.err ? 'b-err' : (entry.fake ? 'b-fake' : 'b-ok');
    var lbl = entry.err ? 'ERROR'  : (entry.fake ? 'FAKE'   : 'REAL');
    tr.innerHTML =
      '<td>' + entry.n + '</td>' +
      '<td>' + entry.time + '</td>' +
      '<td>' + entry.status + '</td>' +
      '<td>' + entry.ms + '</td>' +
      '<td><span class="badge ' + cls + '">' + lbl + '</span></td>' +
      '<td class="body-col">' + escHtml(entry.body) + '</td>';
    logBody.prepend(tr);
  }

  function qs(id) { return document.getElementById(id).value.trim(); }

  async function sendOne(n) {
    var base   = qs('apiBase').replace(/\/+$/,'');
    var params = new URLSearchParams({
      username : qs('username'),
      password : qs('password'),
      'from'   : qs('fromAddr'),
      to       : qs('toAddr'),
      content  : document.getElementById('content').value
    });
    var url  = base + '/api/send/?' + params.toString();
    var t0   = performance.now();
    var time = new Date().toLocaleTimeString();
    try {
      var resp = await fetch(url, { method: 'GET' });
      var body = await resp.text();
      var ms   = Math.round(performance.now() - t0);
      var cls  = classify(resp.status, body);
      total++;
      if (!cls.ok) errCount++;
      else if (cls.fake) fakeCount++;
      else okCount++;
      addRow({ n:n, time:time, status:resp.status, ms:ms,
               err:!cls.ok, fake:cls.fake,
               body: body.slice(0,200) });
    } catch (e) {
      var ms2 = Math.round(performance.now() - t0);
      total++; errCount++;
      addRow({ n:n, time:time, status:'\u2014', ms:ms2,
               err:true, fake:false,
               body:'Network error: ' + e.message });
    }
    updateSummary();
  }

  sendBtn.addEventListener('click', async function () {
    var burst = Math.max(1, parseInt(qs('burstCount'), 10) || 1);
    var delay = Math.max(0, parseInt(qs('burstDelay'), 10) || 0);
    sendBtn.disabled = true;
    try {
      for (var i = 0; i < burst; i++) {
        await sendOne(total + 1);
        if (i < burst - 1 && delay > 0) {
          await new Promise(function(r){ setTimeout(r, delay); });
        }
      }
    } finally {
      sendBtn.disabled = false;
    }
  });

  clearBtn.addEventListener('click', function () {
    rows = []; total = 0; okCount = 0; fakeCount = 0; errCount = 0;
    logBody.innerHTML = '';
    logTable.style.display = 'none';
    emptyState.style.display = '';
    updateSummary();
  });

  exportBtn.addEventListener('click', function () {
    if (!rows.length) return;
    var hdr = 'n,time,httpStatus,latencyMs,error,fake,response\n';
    var csv = hdr + rows.map(function(r) {
      return [r.n, r.time, r.status, r.ms, r.err, r.fake,
              '"' + r.body.replace(/"/g,'""') + '"'].join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download = 'sms_sim_' + Date.now() + '.csv';
    a.click();
  });

  updateSummary();
})();
</script>
</body>
</html>
